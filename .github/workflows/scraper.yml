name: Rolenaut Scraper Pipeline

on:
  schedule:
    # Runs at 05:47 AM IST (00:17 UTC) every early morning
    # Off-peak prime minute (17) avoids GitHub runner scheduling queues
    - cron: "17 0 * * *"
  workflow_dispatch: # Allows manual trigger

jobs:
  scraper-pipeline:
    name: "Rolenaut Daily Scraper & Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run Stage 1 (Fast ATS Scrape)
        timeout-minutes: 35
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python stage1.py

      - name: Run Stage 2 (Deep Experience Verification)
        timeout-minutes: 135
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python stage2.py
